[project]
name = "torch-puzzles"
version = "0.1.0"
description = "Tensor puzzles for learning PyTorch broadcasting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
    "hypothesis",
    "matplotlib",
    "chalk-diagrams",
    "colour",
    "ipython",
    "torchtyping",
    "jupyterlab",
    "numba"
]

[tool.uv.sources]
# GPU puzzles' lib.py needs the patched chalk fork (exports `image`), as installed by the notebook
chalk-diagrams = { git = "https://github.com/danoneata/chalk", branch = "srush-patch-1" }
planar = { git = "https://github.com/chalk-diagrams/planar" }
